# Every argument a config can set, at its default. Copy this file, keep the
# keys you change, and load it with SeldonClassifier.from_config("path.yaml")
# or SeldonRegressor.from_config("path.yaml"). Keyword arguments of
# from_config override the file's keys.

# --- The checkpoint (from_pretrained) ---
# A model name (seldon, seldon-mini: its classifier or its regressor), a
# checkpoint name, a local directory or a Hugging Face repository.
checkpoint: seldon-mini
subfolder: null          # the checkpoint's directory, for a repository of your own
revision: null           # a branch, tag or commit of the repository
token: null              # prefer `hf auth login`: never commit a token

# --- The regressor only (SeldonRegressor) ---
# Clamp the quantiles to the training target's range, widened by this fraction
# of it on each side; null: no clamp. Commented out, as the classifier rejects
# it; left out, a model name's packaged config sets it (0.1 for seldon and
# seldon-mini), any other checkpoint takes the default, null. Uncomment it to
# set it whatever the checkpoint.
# clip_margin: null

# --- The forecaster only (SeldonForecaster.from_config) ---
# Commented out, as the classifier and the regressor reject them.
# max_context_length: 32768  # context rows each series keeps, its latest; null: all
# point_forecast: median     # the target column: median, or mean of the quantiles

# --- The classifier or the regressor ---
n_estimators: 8          # ensemble members
device: null             # cuda when available, else cpu
max_context_size: 200000 # training rows one member reads; more: each member its own random subset
amp: true                # float16 autocast on CUDA
random_state: 0          # seed of the context subsets and of the preprocessing
cudnn_attention: false   # cuDNN attention: faster once a shape has run, seconds per new shape
query_chunk_size: 8192   # test rows through the model together, per member
max_cache_gb: 8.0        # GiB of context encodings kept over members; past it, re-encoded per predict; null: no bound
# Members through the model together: an int, null for all at once, or auto:
# together up to 400k context cells (rows x features) per batch, so a batch
# needs about the memory of one member on a 400k-cell table, whatever the GPU;
# larger members run one at a time. The threshold was measured on an H100.
estimator_batch_size: auto

# --- The preprocessing (SeldonRecipe) ---
recipe:
  # Numerical transforms the members take in turn, one each: identity, power
  # (Yeo-Johnson), robust (quartile scaling, soft-clipped to +-3), rank_gaussian.
  transforms: [identity, power, robust, rank_gaussian]
  # Whether the second half of the members read categorical codes in a random
  # order per column; the first half (rounded up) read them sorted by value.
  half_shuffle: false
  flip_sign: true          # each member negates a random half of its numerical columns
  feature_shuffle: latin   # column permutation per member: latin, random, or null for none
  class_shift: true        # classifier: each member shifts the class codes by its own offset
  average_logits: true     # classifier: average the members' logits, else their probabilities
  softmax_temperature: 1.0 # classifier: divisor of the logits before the softmax
  max_features: 500        # columns the model reads, cut after the shuffle
  cut_features: true       # cut the columns past max_features; false: fit raises instead
  standardize_eps: 1.0e-6  # epsilon of the per-column standardization
  clip_value: 100.0        # bound of the standardized values, before the transform
  rank_gaussian_knots: 8192
  clip_sigma: 4.0          # bound, in standard deviations, after the transform
  category_count_min_cardinality: 50  # categories from which a column gains its category counts
