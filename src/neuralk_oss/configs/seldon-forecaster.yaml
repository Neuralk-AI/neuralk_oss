# Seldon's forecaster: TabPFN-TS's time features (covariate lags, running
# index, calendar, seasonal periods) read by Seldon's regressor, with its
# regressor's settings (half_shuffle) but no clamp of the quantiles to the
# context's range (clip_margin), which would keep a trend from leaving it.
checkpoint: seldon
n_estimators: 4
max_context_size: 200000
random_state: 0
amp: true
clip_margin: null
max_context_length: 32768  # context rows each series keeps, its latest (TabPFN-TS's default)
point_forecast: median
recipe:  # SeldonRecipe's keyword arguments
  half_shuffle: true
