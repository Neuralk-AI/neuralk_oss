# Seldon-Mini's forecaster: TabPFN-TS's time features (covariate lags, running
# index, calendar, seasonal periods) read by Seldon-Mini's regressor. This is
# the only config SeldonForecaster.from_pretrained("seldon-mini") reads;
# seldon-mini-regressor.yaml does not apply. It repeats the regressor's
# settings, but does not clamp the quantiles to the context's range
# (clip_margin), which would keep a trend from leaving it.
checkpoint: seldon-mini
n_estimators: 4
max_context_size: 200000
random_state: 0
amp: true
clip_margin: null
max_context_length: 32768  # context rows each series keeps, its latest (TabPFN-TS's default)
point_forecast: median
recipe:  # SeldonRecipe's keyword arguments
  half_shuffle: true
  cut_features: false  # past max_features, raise instead of cutting columns
