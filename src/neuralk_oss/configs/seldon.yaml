# Seldon with 8 members: members 0-3 read categorical codes sorted by value,
# members 4-7 in a random order per column.
checkpoint: seldon
n_estimators: 8
max_context_size: 200000
random_state: 0
amp: true
recipe:  # SeldonRecipe's keyword arguments, one recipe per group of members
  - members: [0, 1, 2, 3]
    shuffle_categories: false
  - members: [4, 5, 6, 7]
    shuffle_categories: true
