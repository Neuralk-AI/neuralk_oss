[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralk-oss"
version = "0.2.1"
description = "Neuralk-AI open-source models: loading and inference"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Neuralk-AI" }]
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub",
    "numpy",
    "pandas>=2.2,<3",
    "pydantic>=2",
    "pyyaml",
    "safetensors",
    # Pinned: the preprocessing and ensembling Seldon was evaluated with.
    "structured-data-models==0.2.1",
    "torch>=2.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Neuralk-AI/neuralk_oss"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuralk_oss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter wraps code; docstring summaries stay on one line.
ignore = ["E501"]

# GPU test environments: `uvx --with tox-uv tox` on a machine with CUDA.
# gpu-ours runs the versions of uv.lock, with torch 2.11+cu128; gpu-tabarena
# the versions TabArena installs our dependencies at (tests/envs/tabarena.txt).
[tool.tox]
requires = ["tox>=4.21", "tox-uv>=1.11"]
env_list = ["gpu-ours", "gpu-tabarena"]

[tool.tox.env_run_base]
base_python = ["python3.12"]
commands = [
    # Without CUDA the GPU cases would be skipped and the run would pass anyway.
    ["python", "-c", "import torch; assert torch.cuda.is_available(), 'no CUDA GPU'; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name())"],
    ["pytest", { replace = "posargs", extend = true }],
]

[tool.tox.env.gpu-ours]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
# uv.lock but torch, which is the build the CUDA golden references were made
# with: CUDA 12.8 runs on older drivers than the lock's torch. The lock's torch
# dependencies are left to it too, or each sync would swap them back.
uv_sync_flags = [
    "--inexact",
    "--no-install-package", "torch",
    "--no-install-package", "triton",
    "--no-install-package", "cuda-bindings",
    "--no-install-package", "cuda-toolkit",
    "--no-install-package", "setuptools",
]
allowlist_externals = ["uv"]
commands_pre = [
    ["uv", "pip", "install", "--python", "{env_python}", "torch==2.11.0+cu128", "--index-url", "https://download.pytorch.org/whl/cu128"],
]

[tool.tox.env.gpu-tabarena]
deps = ["-r tests/envs/tabarena.txt"]
