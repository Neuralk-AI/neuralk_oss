[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralk-oss"
version = "0.1.0"
description = "Neuralk-AI open-source models: loading and inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Neuralk-AI" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Neuralk-AI/neuralk_oss"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuralk_oss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
