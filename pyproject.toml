[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralk-oss"
version = "0.1.0"
description = "Neuralk-AI open-source models: loading and inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Neuralk-AI" }]
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub",
    "numpy",
    "pandas>=2.2,<3",
    "pydantic>=2",
    "safetensors",
    # Pinned: the preprocessing and ensembling Seldon was evaluated with.
    "structured-data-models==0.2.1",
    "torch>=2.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Neuralk-AI/neuralk_oss"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuralk_oss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter wraps code; docstring summaries stay on one line.
ignore = ["E501"]
