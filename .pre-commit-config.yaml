# Same ruff as uv.lock (`uv run ruff --version`); bump both together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Prepends .license-header.txt to any Python file missing it.
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        types: [python]
        args: [--license-filepath, .license-header.txt]
